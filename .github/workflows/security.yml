name: Security

# Scheduled security scanning, separate from Dependabot: Dependabot only proposes
# an update when a NEW upstream release exists. It says nothing about an advisory
# disclosed against a version you've already shipped (no fix released yet), and
# nothing about leaked secrets or code-level findings. This workflow covers that
# gap with four scans:
#   * an ecosystem advisory scan of the CURRENTLY COMMITTED lockfile (TODO below)
#   * gitleaks     — secret scanning
#   * CodeQL       — SAST
#   * Trivy        — filesystem vulnerability scan, uploaded as SARIF
#
# Intentionally NOT a required check: daily advisory-DB churn shouldn't block a
# PR unrelated to the flagged dependency. A finding turns the job red for
# visibility (and, for Trivy/CodeQL, shows up in the Security tab) without
# wedging merges. See STANDARD.md -> "Supply chain".
on:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC
  pull_request:
    # TODO: narrow to your manifest/lockfile paths (e.g. Cargo.lock,
    # requirements*.txt, package-lock.json) so this only reruns on PRs that can
    # change what's installed. No lockfile at all (e.g. a Debian package
    # resolving deps via apt/debian/control at build time)? Delete the
    # advisory-scan job below instead of leaving it a no-op, and point these
    # paths at whatever does define your shipped dependencies instead.
    paths:
      - '**/Cargo.lock'
      - '**/requirements*.txt'
      - '**/package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  advisory-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # TODO: keep the block(s) matching your ecosystem(s), delete the rest.
      #   Rust:   cargo install cargo-audit --locked && cargo audit
      #   Python: pip install pip-audit && pip-audit -r requirements.txt
      #   Node:   npm audit --audit-level=high
      - run: echo "TODO - run your ecosystem's advisory scan against the committed lockfile"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # gitleaks needs history, not just the working tree

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # TODO: set `languages:` for your stack (e.g. rust, python,
      # javascript-typescript). No CodeQL-supported language in this repo (e.g.
      # pure shell/bash tooling)? Use `actions` instead of dropping this job —
      # it still scans the workflow YAML for injection/permission issues, which
      # is real SAST coverage even when nothing else here is analyzable.
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: TODO  # e.g. rust, python, javascript-typescript, or actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8, same pin as codeql job
        with:
          sarif_file: trivy-results.sarif
